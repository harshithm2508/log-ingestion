spring.application.name=log-ingestion

# -----Datasource-----
# All the secrets from environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/log_ingestion}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.connection-timeout=5000

# ----- Spring JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true

#-----Actuator-------
management.endpoints.web.exposure.include=health
management.endpoints.health.show-details=never

#-----Shutdown-----
# Boot 4 shuts down gracefully by default: on stop, it rejects new requests and lets requests already in progress finish. This sets how long it waits.
# 20 s is longer than any single request should take (one insert and one small transaction).
# Without graceful shutdown, a request could be cut off between the raw insert committing and normalization finishing, leaving a stuck PENDING event.
spring.lifecycle.timeout-per-shutdown-phase=20s